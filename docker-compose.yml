services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: jobastra
      POSTGRES_USER: jobastra
      POSTGRES_PASSWORD: jobastra
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobastra -d jobastra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
